name: Android

# Build check of the Android port. The game code is generated from your own
# default.xex, which never goes into this repository, and the shader cache from
# its xeshader.sdb: CI builds everything else against stand-ins for both
# (scripts/android/make-stub-generated.py). That checks the ReXGlue SDK, the
# port's own sources and the app for Android, and packages an APK that cannot
# play anything: the real APK is built with your game files by
# scripts/build-android.ps1 (see docs/android.md).

on:
  push:
    branches: [main, develop, "android/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # ci-publish-log.sh pushes build logs to ci-logs/* branches

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"  # NDK r29: its Clang has #embed (scripts/build-android.ps1 uses the same)
  ANDROID_PLATFORM: android-29

jobs:
  turnip:
    # Turnip, Mesa's Vulkan driver for Adreno GPUs, bundled with the app
    # (scripts/android/build-turnip.sh); cached per Mesa tag and script.
    name: Turnip driver (Mesa)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: build/turnip-out
          key: turnip-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/android/build-turnip.sh', 'tools/android/dependencies.json') }}

      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build bison flex pkg-config glslang-tools
          pip install --break-system-packages meson mako pyyaml packaging
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null

      - name: Build Turnip
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/android/build-turnip.sh "$ANDROID_HOME/ndk/${NDK_VERSION}" build/turnip-out 2>&1 | tee build/turnip-build.log

      - name: Publish build log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/android/ci-publish-log.sh turnip build/turnip-build.log

      - name: Upload Turnip
        uses: actions/upload-artifact@v4
        with:
          name: turnip
          path: build/turnip-out/
          retention-days: 7

  android:
    name: Android arm64 (stub game code)
    needs: turnip
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ env.NDK_VERSION }}
          max-size: 3G

      - name: Apply SDK patches
        run: bash scripts/android/apply-sdk-patches.sh

      - name: Fetch native renderer sources
        run: bash scripts/android/fetch-deps.sh

      - name: Stand-ins for the game files
        run: |
          python3 -I scripts/android/make-stub-generated.py .
          mkdir -p build/stub-shader-cache
          printf 'NRSC' > build/stub-shader-cache/shader_cache_spirv.bin
          echo '{}' > build/stub-shader-cache/shader_manifest.json

      - name: Configure
        run: |
          set -o pipefail
          mkdir -p build
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="$ANDROID_PLATFORM" -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DREXSDK_DIR="$PWD/sdk" -DREXGLUE_HOST_TOOL=/bin/true \
            -DBROKENBOND_ADRENOTOOLS_SOURCE="$PWD/out/libadrenotools" \
            -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_BUILD_TESTS=OFF \
            -DBROKENBOND_NATIVE_RENDERER=ON -DBROKENBOND_NATIVE_D3D12=OFF -DBROKENBOND_NATIVE_VULKAN=ON \
            -DNATIVE_RENDERER_PLUME_SOURCE="$PWD/out/plume" \
            -DBROKENBOND_PREBUILT_SHADER_CACHE="$PWD/build/stub-shader-cache" \
            -DBROKENBOND_VERSION=ci 2>&1 | tee build/configure.log

      - name: Build the native libraries
        run: |
          set -o pipefail
          cmake --build build/android --target android_jnilibs -- -k 0 2>&1 | tee build/native-build.log

      - name: Bundle Turnip
        uses: actions/download-artifact@v4
        with:
          name: turnip
          path: android/app/src/main/assets/gpu

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../build/gradle-build.log

      - name: Check the APK
        run: |
          set -o pipefail
          {
            apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
            readelf="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            echo "APK: $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E 'lib/|classes|assets/'
            mkdir -p build/apk-check && unzip -q -o "$apk" 'lib/*' -d build/apk-check
            libs=build/apk-check/lib/arm64-v8a
            unzip -l "$apk" > build/apk-check/listing.txt
            grep -q 'assets/gpu/libvulkan_freedreno.so' build/apk-check/listing.txt || { echo "missing the bundled Turnip"; exit 1; }
            for lib in libmain.so librexruntime.so libSDL3.so libc++_shared.so \
                       libhook_impl.so libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so; do
              test -f "$libs/$lib" || { echo "missing $lib"; exit 1; }
            done
            for lib in "$libs"/*.so; do
              echo "== $(basename "$lib"): $("$readelf" -d "$lib" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/' | tr '\n' ' ')"
              # 16 KB page devices (Android 15+) need LOAD segments aligned to 16 KB or more.
              for align in $("$readelf" -lW "$lib" | awk '$1 == "LOAD" { print $NF }'); do
                (( align >= 16384 )) || { echo "$(basename "$lib"): LOAD segment aligned to $align"; exit 1; }
              done
            done
            # SDLActivity calls SDL_main in libmain.so; the on-screen controller calls the JNI functions.
            "$readelf" --dyn-syms -W "$libs/libmain.so" > build/apk-check/libmain-symbols.txt
            for symbol in SDL_main Java_org_brokenbond_port_TouchControllerView_nativeAttach \
                          Java_org_brokenbond_port_TouchControllerView_nativeButton \
                          Java_org_brokenbond_port_TouchControllerView_nativeAxis \
                          Java_org_brokenbond_port_TouchControllerView_nativeDetach; do
              grep -E -q "DEFAULT +[0-9]+ $symbol\$" build/apk-check/libmain-symbols.txt ||
                { echo "libmain.so does not export $symbol"; exit 1; }
            done
            echo "APK check passed"
          } 2>&1 | tee build/apk-check.log

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          for f in configure native-build gradle-build apk-check; do
            [ -f "build/$f.log" ] && { echo "===== $f ====="; cat "build/$f.log"; }
          done > build/android-build.log
          bash scripts/android/ci-publish-log.sh android build/android-build.log

      - name: Upload the stand-in APK (not playable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-apk-stub-game-code-NOT-PLAYABLE
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
